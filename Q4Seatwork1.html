<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 Seatwork 1</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(to bottom right, #8c8ca8, #5b5b73);
            background-image: url('https://i.pinimg.com/1200x/0d/91/ec/0d91ec6e1e8de9874f47ec2702411d55.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            font-family: Arial, sans-serif;
        }

        .login-box{
            background: rgba(33, 69, 141, 0.3);
            width: 500px;
            margin: 60px auto;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.4);
            color: rgb(208, 238, 255);
        }

        input{
            border-radius: 20px !important;
            text-align: center;
        }

     .btn-login{
            background-color: #00cfff;
            border: none;
            border-radius: 20px;
            padding: 8px 25px;
        }

        .btn-cancel{
            border-radius: 20px;
            padding: 8px 25px;
        }

a{
    color: aliceblue;
}
    </style>
</head>
<body>



<div class="login-box text-center">

<h1>Login</h1>

    <h5 class="mt-4">Username</h5>
<input type="text" id="user" class="form-control mb-3" placeholder="Enter here">

    <h5>Password</h5>
 <input type="password" id="pass" class="form-control mb-3" placeholder="Enter password">

 <div class="form-check text-start mb-3">
        <input class="form-check-input" type="radio" id="stay">
        <label class="form-check-label">Stay logged in</label>
    </div>

    <button class="btn btn-login" onclick="login()">Login</button>
<button class="btn btn-light btn-cancel" onclick="clearForm()">Cancel</button>

    <hr>

    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">Forgot username / password?</a>
</div>

<script>
    function showMsg(){
        alert("Instructions opened.");
    }

function login(){

        let username = document.getElementById("user").value;
    let password = document.getElementById("pass").value;

let correct = "mrbeast67";
let correct2 = "12345678";

        if(username == correct && password == correct2){
            alert("Welcome " + username + "!");
        }
        else{
            alert("Incorrect username and/or password.");
        }
    }


    function clearForm(){
     document.getElementById("user").value = "";
        document.getElementById("pass").value = "";
    }
</script>

</body>
</html>
